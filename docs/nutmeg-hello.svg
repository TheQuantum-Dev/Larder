<svg width="240" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nutmeg</title>
<desc>Nutmeg, the amber pantry creature, breathing, blinking and breaking into a big smile.</desc>
<style>
  .breathe { animation: breathe 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: 340px 480px; }
  .leaf { animation: sway 3s ease-in-out infinite; transform-box: view-box; transform-origin: 340px 185px; }
  .blink { animation: blink 6s linear infinite; transform-box: view-box; transform-origin: 340px 302px; }
  .squint { animation: squint 6s ease-in-out infinite; transform-box: view-box; transform-origin: 340px 302px; }
  .look { animation: look 6s ease-in-out infinite; }
  .cheek { animation: blush 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 0.975); } }
  @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink { 0%, 17%, 23%, 88%, 94%, 100% { transform: scaleY(1); } 20%, 91% { transform: scaleY(0.08); } }
  @keyframes squint { 0%, 40%, 78%, 100% { transform: scaleY(1); } 48%, 70% { transform: scaleY(0.86); } }
  @keyframes look { 0%, 26%, 36%, 100% { transform: translate(0, 0); } 29%, 33% { transform: translate(-8px, 2px); } }
  @keyframes blush { 0%, 40%, 78%, 100% { opacity: 0.35; } 48%, 70% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) {
    .breathe, .leaf, .blink, .squint, .look, .cheek { animation: none; }
  }
</style>
<ellipse cx="300" cy="472" rx="30" ry="18" fill="#D98F2A"/>
<ellipse cx="382" cy="472" rx="30" ry="18" fill="#D98F2A"/>
<g class="breathe">
  <g class="leaf"><path d="M340 185 C318 150 330 108 352 85 C362 112 372 148 340 185 Z" fill="#8CAE66"/></g>
  <ellipse cx="340" cy="335" rx="160" ry="148" fill="#F0A83A"/>
  <ellipse cx="340" cy="385" rx="92" ry="68" fill="#F6C067"/>
  <g class="squint"><g class="blink">
    <ellipse cx="285" cy="300" rx="40" ry="44" fill="#FFFFFF"/>
    <ellipse cx="395" cy="300" rx="40" ry="44" fill="#FFFFFF"/>
    <g class="look">
      <circle cx="298" cy="308" r="18" fill="#3B2A1A"/>
      <circle cx="408" cy="304" r="18" fill="#3B2A1A"/>
      <circle cx="304" cy="302" r="5" fill="#FFFFFF"/>
      <circle cx="414" cy="298" r="5" fill="#FFFFFF"/>
    </g>
  </g></g>
  <circle class="cheek" cx="248" cy="345" r="16" fill="#E8654A" opacity="0.35"/>
  <circle class="cheek" cx="432" cy="345" r="16" fill="#E8654A" opacity="0.35"/>
  <path d="M296 370 Q340 412 384 370 Q340 386 296 370 Z" fill="#5A3A1E">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0; 0.4; 0.48; 0.7; 0.78; 1"
             keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1"
             values="M296 370 Q340 412 384 370 Q340 386 296 370 Z;
                     M296 370 Q340 412 384 370 Q340 386 296 370 Z;
                     M284 362 Q340 436 396 362 Q340 380 284 362 Z;
                     M284 362 Q340 436 396 362 Q340 380 284 362 Z;
                     M296 370 Q340 412 384 370 Q340 386 296 370 Z;
                     M296 370 Q340 412 384 370 Q340 386 296 370 Z"/>
  </path>
</g>
</svg>
